<div data-view="transfers" hidden>
  <h1>Преводи</h1>
  <div data-tabs>
    <div class="tabs" role="tablist"><button role="tab">Изпрати пари</button><button role="tab">Разписки</button><button role="tab">Получени</button></div>
    <section class="panel" role="tabpanel">
      <form id="transfer-form" novalidate>
        <label class="field"><span>IBAN на получателя</span><input name="iban" type="text" autocomplete="off" placeholder="BG00 XXXX 0000 0000 0000 00"></label>
        <div class="field-row"><label class="field"><span>Сума</span><input name="amount" type="number" min="0.01" step="0.01"></label>
          <label class="field"><span>Валута</span><select name="cur" id="tr-cur"><option value="EUR">EUR</option><option value="USD">USD</option><option value="GBP">GBP</option><option value="CHF">CHF</option><option value="RON">RON</option></select></label></div>
        <p class="note" id="tr-fx" aria-live="polite"></p>
        <label class="field"><span>Основание</span><input name="reason" type="text" maxlength="60"></label>
        <button class="button button-gold" type="submit">Изпрати превода</button>
        <p class="form-msg" role="status"></p>
      </form>
    </section>
    <section class="panel" role="tabpanel">
      <ul class="tx-list" id="tr-sent"></ul>
    </section>
    <section class="panel" role="tabpanel">
      <ul class="tx-list" id="tr-recv"></ul>
    </section>
  </div>
</div>
